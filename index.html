<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASCII Eyes - watching, blinking, made of code</title>
<meta name="description" content="Two watching eyes drawn entirely from letters, digits and code symbols. They follow your finger and blink. No images, no video - just text.">
<style>
  html, body { margin: 0; min-height: 100%; background: #070b09; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: #73a89a; padding: 16px; box-sizing: border-box;
  }
  .panel {
    width: 100%; max-width: 880px; border-radius: 12px; overflow: hidden;
    background: #0b100e; border: 1px solid #16211d;
    box-shadow: 0 24px 80px rgba(0,0,0,.55);
  }
  canvas { display: block; width: 100%; touch-action: pan-y; cursor: crosshair; }
  .hint {
    margin-top: 14px; font-size: 12px; letter-spacing: .04em; color: #3f5f55; text-align: center;
  }
  .hint b { color: #73a89a; font-weight: 600; }
</style>
</head>
<body>
<div class="panel"><canvas id="eyes" role="img" aria-label="Two eyes drawn from text characters, blinking and following your pointer"></canvas></div>
<p class="hint"><b>move</b> - the eyes follow &nbsp;·&nbsp; <b>tap</b> - they blink &nbsp;·&nbsp; 100% text, no images</p>
<script>
'use strict';
const canvas = document.getElementById('eyes');
const ctx = canvas.getContext('2d');
const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

const IRIS_CHARS = ['0','1','{','}','/','\\','|','+','=',';','<','>','$','%','(',')'];
const PUPIL_CHARS = ['@','#','%','&'];
const WHITE_CHARS = ['.',"'",',','`','.'];
const RAIN_CHARS = ['0','1',':',';','|','/','\\','{','}','$','=','+'];
const WORDS = ['nmap','scan','sudo','root','ping','0x41','{;}','for','&&','||','port','8080','ssh','grep','if'];

function hash(x, y, t) {
  let h = (x * 73856093) ^ (y * 19349663) ^ (t * 83492791);
  h = (h ^ (h >> 13)) * 1274126177;
  return ((h ^ (h >> 16)) >>> 0) / 4294967295;
}
const clamp = (v, lo, hi) => v < lo ? lo : v > hi ? hi : v;
const easeInOut = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

let width = 0, height = 0, cellW = 8, cellH = 14, cols = 0, rows = 0;
let lastDraw = 0;
const gaze = { x: 0, y: 0, tx: 0, ty: 0 };
let nextSaccade = 1.2;
let openness = 1, blinkStart = -1, blinkDuration = 0.24, nextBlink = 2.2 + Math.random() * 2.5, pendingDouble = false;
let wordMap = new Map(), era = -1;
let rain = [];

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  const w = canvas.parentElement.clientWidth;
  const h = clamp(Math.round(w * 0.66), 200, 500);
  if (Math.abs(w - width) < 1 && Math.abs(h - height) < 1) return;
  width = w; height = h;
  canvas.style.height = height + 'px';
  canvas.width = Math.round(width * dpr);
  canvas.height = Math.round(height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const fontSize = clamp(Math.round(width / 26), 11, 16);
  ctx.font = '700 ' + fontSize + 'px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';
  cellW = ctx.measureText('M').width;
  cellH = Math.round(fontSize * 1.3);
  cols = Math.max(1, Math.floor(width / cellW));
  rows = Math.max(1, Math.floor(height / cellH));
  rain = [];
  const rainCount = Math.floor(cols / 7);
  for (let i = 0; i < rainCount; i++) {
    rain.push({ col: Math.floor(Math.random() * cols), y: Math.random() * rows, speed: 2 + Math.random() * 4, len: 4 + Math.floor(Math.random() * 6) });
  }
}

const eyeGeometry = cx => ({ cx, cy: height * 0.5, a: width * 0.225, b: Math.min(height * 0.46, width * 0.225 * 0.58) });
const almond = u => { const t = 1 - u * u; return t <= 0 ? 0 : Math.pow(t, 0.72); };

function pickWords(timeSlot, eyes) {
  wordMap = new Map();
  for (let e = 0; e < eyes.length; e++) {
    const { cx, cy, a, b } = eyes[e];
    const placed = 2 + Math.floor(hash(e, timeSlot, 7) * 2);
    for (let w = 0; w < placed; w++) {
      const word = WORDS[Math.floor(hash(e * 31 + w, timeSlot, 13) * WORDS.length)];
      const startCol = Math.floor(hash(e * 17 + w, timeSlot, 29) * cols);
      const row = Math.floor(hash(e * 13 + w, timeSlot, 37) * rows);
      for (let k = 0; k < word.length; k++) {
        const col = startCol + k;
        if (col >= cols) break;
        const px = (col + 0.5) * cellW, py = (row + 0.5) * cellH;
        const u = (px - cx) / a, v = (py - cy) / b;
        const insideEye = Math.abs(u) <= 1 && Math.abs(v) <= almond(u) * openness;
        const dx = px - (cx + gaze.x), dy = py - (cy + gaze.y);
        const r = Math.min(b * 0.95, a * 0.44);
        const inIris = dx * dx + dy * dy <= r * r && dx * dx + dy * dy > (r * 0.42) * (r * 0.42);
        if (insideEye && inIris) wordMap.set(col + ',' + row, word[k]);
      }
    }
  }
}

function draw(nowMs) {
  const t = nowMs / 1000;

  if (blinkStart < 0 && t >= nextBlink) { blinkStart = t; blinkDuration = 0.2 + Math.random() * 0.08; }
  if (blinkStart >= 0) {
    const p = (t - blinkStart) / blinkDuration;
    if (p >= 1) {
      openness = 1;
      if (pendingDouble) { pendingDouble = false; blinkStart = t; }
      else {
        blinkStart = -1;
        nextBlink = t + 2.2 + Math.random() * 3.6;
        if (Math.random() < 0.16) pendingDouble = true;
      }
    } else {
      const phase = p < 0.5 ? p * 2 : (1 - p) * 2;
      openness = 1 - (1 - 0.06) * easeInOut(phase);
    }
  }

  if (t >= nextSaccade) {
    gaze.tx = (Math.random() * 2 - 1) * width * 0.07;
    gaze.ty = (Math.random() * 2 - 1) * height * 0.16;
    nextSaccade = t + 0.9 + Math.random() * 2.2;
  }
  const follow = reduced ? 1 : 0.14;
  gaze.x += (gaze.tx - gaze.x) * follow;
  gaze.y += (gaze.ty - gaze.y) * follow;

  const eyes = [eyeGeometry(width * 0.27), eyeGeometry(width * 0.73)];

  const eraNow = Math.floor(t / 1.6);
  if (eraNow !== era) { era = eraNow; pickWords(eraNow, eyes); }

  ctx.fillStyle = '#0b100e';
  ctx.fillRect(0, 0, width, height);

  for (const drop of rain) {
    drop.y += drop.speed * (1 / 30);
    if (drop.y - drop.len > rows) {
      drop.y = -Math.random() * 6;
      drop.col = Math.floor(Math.random() * cols);
      drop.speed = 2 + Math.random() * 4;
    }
    for (let k = 0; k < drop.len; k++) {
      const ry = Math.floor(drop.y) - k;
      if (ry < 0 || ry >= rows) continue;
      const c = RAIN_CHARS[Math.floor(hash(drop.col, ry, Math.floor(t * 2)) * RAIN_CHARS.length)];
      const fade = 1 - k / drop.len;
      ctx.fillStyle = 'rgba(86, 168, 144, ' + (0.3 * fade) + ')';
      ctx.fillText(c, (drop.col + 0.5) * cellW, (ry + 0.5) * cellH);
    }
  }

  for (let e = 0; e < eyes.length; e++) {
    const { cx, cy, a, b } = eyes[e];
    const gx = clamp(gaze.x, -a * 0.58, a * 0.58);
    const gy = clamp(gaze.y, -b * 0.3, b * 0.3);
    const irisR = Math.min(b * 0.95, a * 0.44);
    const pupilR = irisR * 0.42;
    const icx = cx + gx, icy = cy + gy;
    const topB = openness;
    const botB = 1 - (1 - openness) * 0.72;

    const colLo = Math.max(0, Math.floor((cx - a - cellW) / cellW));
    const colHi = Math.min(cols - 1, Math.ceil((cx + a + cellW) / cellW));
    const rowLo = Math.max(0, Math.floor((cy - b - cellH) / cellH));
    const rowHi = Math.min(rows - 1, Math.ceil((cy + b + cellH) / cellH));

    for (let row = rowLo; row <= rowHi; row++) {
      for (let col = colLo; col <= colHi; col++) {
        const px = (col + 0.5) * cellW, py = (row + 0.5) * cellH;
        const u = (px - cx) / a;
        if (Math.abs(u) > 1.08) continue;
        const v = (py - cy) / b;
        const shape = almond(clamp(u, -1, 1));
        const topEdge = -shape * topB, botEdge = shape * botB;
        const inside = v >= topEdge && v <= botEdge;
        const edgeDist = Math.min(Math.abs(v - topEdge), Math.abs(v - botEdge)) * b;

        if (inside) {
          const dx = px - icx, dy = py - icy;
          const d2 = dx * dx + dy * dy;
          const flicker = 0.9 + 0.1 * hash(col, row, Math.floor(t * 8));
          const word = wordMap.get(col + ',' + row);
          if (d2 <= pupilR * pupilR) {
            const c = PUPIL_CHARS[Math.floor(hash(col, row, Math.floor(t * 1.5)) * PUPIL_CHARS.length)];
            ctx.fillStyle = 'rgba(232, 255, 242, ' + (1.0 * flicker) + ')';
            ctx.fillText(c, px, py);
          } else if (d2 <= irisR * irisR) {
            const radial = Math.sqrt(d2) / irisR;
            const ring = radial > 0.82 ? 0.72 : 1;
            if (word) {
              ctx.fillStyle = 'rgba(245, 255, 250, ' + (1.0 * flicker * ring) + ')';
              ctx.fillText(word, px, py);
            } else {
              const slot = Math.floor(t * 2.5);
              const c = IRIS_CHARS[Math.floor(hash(col, row, slot) * IRIS_CHARS.length)];
              const bright = 0.85 + 0.15 * (1 - radial);
              ctx.fillStyle = 'rgba(150, 208, 188, ' + (bright * flicker * ring) + ')';
              ctx.fillText(c, px, py);
            }
          } else {
            if (hash(col, row, 3) < 0.24) {
              const c = WHITE_CHARS[Math.floor(hash(col, row, 91) * WHITE_CHARS.length)];
              ctx.fillStyle = 'rgba(150, 200, 182, ' + (0.9 * flicker) + ')';
              ctx.fillText(c, px, py);
            }
          }
        } else if (edgeDist < cellH * 0.55 && Math.abs(u) <= 1.02) {
          const nearTop = Math.abs(v - topEdge) < Math.abs(v - botEdge);
          let c;
          if (openness < 0.3) c = '-';
          else if (Math.abs(u) > 0.88) c = u < 0 ? '<' : '>';
          else if (nearTop) c = u < 0 ? '/' : '\\';
          else c = u < 0 ? '\\' : '/';
          const flicker = 0.92 + 0.08 * hash(col, row, Math.floor(t * 6));
          ctx.fillStyle = 'rgba(205, 242, 226, ' + (1.0 * flicker) + ')';
          ctx.fillText(c, px, py);
        }
      }
    }
  }

  ctx.fillStyle = 'rgba(150, 208, 188, 0.85)';
  ctx.font = '400 ' + Math.max(9, Math.round(cellH * 0.72)) + 'px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';
  ctx.textAlign = 'left';
  ctx.fillText('$ ./eyes --watch', cellW * 0.6, cellH * 0.7);
  ctx.textAlign = 'center';
}

function loop(nowMs) {
  if (nowMs - lastDraw >= 33) { lastDraw = nowMs; draw(nowMs); }
  requestAnimationFrame(loop);
}

function eyesTarget(i) { return eyeGeometry(i === 0 ? width * 0.27 : width * 0.73); }
function onPointerMove(ev) {
  const rect = canvas.getBoundingClientRect();
  const px = ev.clientX - rect.left, py = ev.clientY - rect.top;
  const target = eyesTarget(px < width / 2 ? 0 : 1);
  gaze.tx = clamp((px - target.cx) * 0.35, -width * 0.09, width * 0.09);
  gaze.ty = clamp((py - target.cy) * 0.5, -height * 0.2, height * 0.2);
  nextSaccade = performance.now() / 1000 + 1.6;
}
canvas.addEventListener('pointermove', onPointerMove);
canvas.addEventListener('pointerdown', ev => {
  onPointerMove(ev);
  if (blinkStart < 0) { blinkStart = performance.now() / 1000; blinkDuration = 0.18; pendingDouble = false; }
});
window.addEventListener('resize', resize);

resize();
if (reduced) draw(1000); else requestAnimationFrame(loop);
</script>
</body>
</html>
